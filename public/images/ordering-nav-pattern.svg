<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="224" height="224" viewBox="0 0 224 224">
  <defs>
    <path id="petal" d="M0 0 A56 56 0 0 1 56 -56 A56 56 0 0 1 0 0Z"/>
    <g id="dots">
      <circle cx="18" cy="-18" r="4.5"/>
      <circle cx="30" cy="-30" r="3.2"/>
      <circle cx="42" cy="-42" r="2"/>
    </g>
    <g id="flower">
      <use xlink:href="#petal"/>
      <use xlink:href="#petal" transform="rotate(90)"/>
      <use xlink:href="#petal" transform="rotate(180)"/>
      <use xlink:href="#petal" transform="rotate(270)"/>
    </g>
    <g id="flower-dots">
      <use xlink:href="#dots"/>
      <use xlink:href="#dots" transform="rotate(90)"/>
      <use xlink:href="#dots" transform="rotate(180)"/>
      <use xlink:href="#dots" transform="rotate(270)"/>
    </g>
    <g id="outlined">
      <use xlink:href="#flower" fill="none" stroke="#fff0a6" stroke-width="2.5"/>
      <use xlink:href="#flower-dots" fill="#fff0a6"/>
    </g>
    <g id="filled">
      <use xlink:href="#flower" fill="#ffe984"/>
      <use xlink:href="#flower-dots" fill="#ffd400"/>
    </g>
  </defs>
  <use xlink:href="#outlined" x="56" y="56"/>
  <use xlink:href="#filled" x="168" y="56"/>
  <use xlink:href="#filled" x="56" y="168"/>
  <use xlink:href="#outlined" x="168" y="168"/>
</svg>
